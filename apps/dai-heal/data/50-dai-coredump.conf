# D.Ai Heal (docs/EVOLVE.md §4): record THAT a program crashed (name, time,
# signal) so help can be offered, but never keep the memory dump: it can
# contain passwords and documents, and it fills the disk.
[Coredump]
Storage=none
ProcessSizeMax=0
