<!-- Ruby's shield (docs/BROWSER.md stage 2). Words come from _locales; the direction follows the language. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <h1><img src="../icons/ruby.svg" alt="" width="20" height="20"> <span data-i18n="shield"></span></h1>
  <section aria-labelledby="site-title">
    <h2 id="site-title" data-i18n="site"></h2>
    <p id="site" class="site" dir="ltr"></p>
    <label class="row"><input type="checkbox" id="remember"> <span data-i18n="remember"></span></label>
    <p id="cookies" class="muted"></p>
    <button type="button" id="forget" data-i18n="forget"></button>
  </section>
  <section aria-labelledby="cleaning-title">
    <h2 id="cleaning-title" data-i18n="cleaning"></h2>
    <label class="row"><input type="checkbox" id="cleaning"> <span data-i18n="cleaning"></span></label>
    <p class="muted" data-i18n="cleaning_hint"></p>
    <button type="button" id="clean-all" data-i18n="clean_all"></button>
  </section>
  <section aria-labelledby="spaces-title">
    <h2 id="spaces-title" data-i18n="spaces"></h2>
    <div class="spaces">
      <button type="button" data-space="work" data-i18n="space_work"></button>
      <button type="button" data-space="home" data-i18n="space_home"></button>
      <button type="button" data-space="school" data-i18n="space_school"></button>
    </div>
  </section>
  <section aria-labelledby="sessions-title">
    <h2 id="sessions-title" data-i18n="sessions"></h2>
    <ul id="sessions"></ul>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="muted" data-i18n="local_only"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
