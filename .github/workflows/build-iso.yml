name: Build ISO

on:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "tests/boot/**"
      - ".github/workflows/build-iso.yml"
  pull_request:
    paths:
      - "build/**"
      - "tests/boot/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck build/scripts/*.sh tests/boot/*.sh \
            build/live-build/common/hooks/normal/*.hook.chroot \
            build/live-build/common/includes.chroot_after_packages/usr/lib/live/config/*
          shellcheck -s sh build/live-build/common/includes.chroot_after_packages/etc/skel/.config/labwc/autostart

  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        edition: [user, dev]
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build ISO (Debian trixie container)
        run: |
          docker run --rm --privileged \
            -e DAI_VERSION="0.1.0-alpha+${GITHUB_SHA::7}" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src" -w /src \
            debian:trixie \
            bash build/scripts/build-iso.sh "${{ matrix.edition }}" /src/out

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.edition }}
          path: .work/${{ matrix.edition }}/build.log
          if-no-files-found: ignore

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
          # Allow the runner user to use KVM when the host exposes it.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot test
        run: bash tests/boot/boot-test.sh out/dai-os-${{ matrix.edition }}-*.iso boot-artifacts

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.edition }}
          path: boot-artifacts/
          if-no-files-found: ignore

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: dai-os-${{ matrix.edition }}-iso
          path: |
            out/*.iso
            out/*.sha256
            out/*.packages
          retention-days: 7
          compression-level: 0

  # Publish boot screenshots and check reports to the ci-screenshots branch
  # so they can be viewed on GitHub and referenced from docs.
  screenshots:
    needs: build
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: boot-*
          path: shots

      - name: Publish to ci-screenshots branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p publish
          for edition in user dev; do
            for file in desktop.png apps.png system-checks.txt; do
              src="shots/boot-$edition/$file"
              if [ -f "$src" ]; then cp "$src" "publish/$edition-$file"; fi
            done
          done
          if [ -z "$(ls -A publish)" ]; then
            echo "No screenshots to publish"
            exit 0
          fi
          cd publish
          printf '# D.Ai OS CI screenshots\n\n- Source commit: %s\n- Workflow run: %s\n' \
            "$SOURCE_SHA" "$RUN_URL" > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI screenshots for ${SOURCE_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screenshots
          ls -la
