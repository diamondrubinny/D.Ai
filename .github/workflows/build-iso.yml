name: Build ISO

on:
  push:
    paths:
      - "build/**"
      - "tests/boot/**"
      - ".github/workflows/build-iso.yml"
  pull_request:
    paths:
      - "build/**"
      - "tests/boot/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck build/scripts/*.sh tests/boot/*.sh \
            build/live-build/common/hooks/normal/*.hook.chroot \
            build/live-build/common/includes.chroot_after_packages/usr/lib/live/config/*

  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        edition: [user, dev]
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build ISO (Debian trixie container)
        run: |
          docker run --rm --privileged \
            -e DAI_VERSION="0.1.0-alpha+${GITHUB_SHA::7}" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src" -w /src \
            debian:trixie \
            bash build/scripts/build-iso.sh "${{ matrix.edition }}" /src/out

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.edition }}
          path: .work/${{ matrix.edition }}/build.log
          if-no-files-found: ignore

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
          # Allow the runner user to use KVM when the host exposes it.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot test
        run: bash tests/boot/boot-test.sh out/dai-os-${{ matrix.edition }}-*.iso boot-artifacts

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.edition }}
          path: boot-artifacts/
          if-no-files-found: ignore

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: dai-os-${{ matrix.edition }}-iso
          path: |
            out/*.iso
            out/*.sha256
            out/*.packages
          retention-days: 7
          compression-level: 0
