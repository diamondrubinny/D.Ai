name: Build ISO

on:
  push:
    branches: [main]
    # Tag pushes ignore the path filter: every v* tag builds and publishes a release.
    tags: ["v*"]
    paths:
      - "build/**"
      - "apps/**"
      - "tests/boot/**"
      - "tests/apt/**"
      - "site/**"
      - "tests/site/**"
      - ".github/workflows/build-iso.yml"
  pull_request:
    paths:
      - "build/**"
      - "apps/**"
      - "tests/boot/**"
      - "tests/apt/**"
      - "site/**"
      - "tests/site/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Qt for the window tests (every window passes Raz's accessibility audit)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pyqt6 >/dev/null
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck build/scripts/*.sh tests/boot/*.sh tests/apt/*.sh \
            build/live-build/common/hooks/normal/*.hook.chroot \
            build/live-build/common/includes.chroot_after_packages/usr/lib/live/config/*
          shellcheck -s sh build/live-build/common/includes.chroot_after_packages/etc/skel/.config/labwc/autostart \
            build/live-build/common/includes.chroot_after_packages/usr/bin/startdai-wayland \
            build/live-build/common/includes.chroot_after_packages/usr/bin/dai-screenshot \
            build/live-build/common/includes.chroot_after_packages/usr/bin/dai-keyboard \
            build/live-build/common/includes.chroot_after_packages/usr/bin/dai-nightlight \
            apps/dai-command/data/dai-command apps/dai-command/data/dai-fixlayout apps/dai-command/data/dai-lang \
            apps/dai-tune/data/dai-tune apps/dai-tune/data/dai-tune-helper apps/dai-tune/data/dai-rescue \
            apps/dai-ai/data/daid apps/dai-ai/data/dai-ai apps/dai-ai/data/dai-models apps/dai-ruby/data/dai-ruby-diamond \
            apps/dai-forge/data/dai-forge apps/dai-forge/data/dai-forge-gui apps/dai-voice/data/dai-voice apps/dai-code/data/dai-code apps/dai-welcome/data/dai-welcome apps/dai-find/data/dai-find apps/dai-doctor/data/dai-doctor apps/dai-privacy/data/dai-privacy apps/dai-backup/data/dai-backup apps/dai-move/data/dai-move apps/dai-clip/data/dai-clip apps/dai-ocr/data/dai-ocr apps/dai-focus/data/dai-focus apps/dai-settings/data/dai-settings apps/dai-store/data/dai-store apps/dai-captions/data/dai-captions apps/dai-explain/data/dai-explain apps/dai-speak/data/dai-speak apps/dai-way/data/dai-way apps/dai-sound/data/dai-sound apps/dai-chat/data/dai-chat apps/dai-heal/data/dai-heal apps/dai-evolve/data/dai-evolve apps/dai-quick/data/dai-quick apps/dai-mom/data/dai-mom apps/dai-j/data/dai-j apps/dai-raz/data/dai-raz apps/dai-raz/data/dai-raz-guard apps/dai-tune/data/dai-snapshots-firstboot apps/dai-tune/data/dai-offline-run apps/dai-oem/data/dai-oem apps/dai-oem/data/dai-oem-helper apps/dai-oem/data/dai-oem-setup apps/dai-oem/data/labwc/autostart \
            build/live-build/common/includes.chroot_after_packages/usr/bin/dai-install
          shellcheck build/scripts/build-llama.sh build/scripts/build-panel-plugin.sh build/scripts/build-whisper.sh

      - name: Packages and update repository (signature, redirect, pinning; Debian trixie container)
        run: docker run --rm -v "$PWD:/src:ro" -w /src debian:trixie bash tests/apt/apt-repo-test.sh

      - name: Language packs exist in Debian 13 (every package and locale the language recipes use)
        run: docker run --rm -v "$PWD:/src:ro" -w /src debian:trixie bash tests/apt/language-packages.sh

      - name: D.Ai Server edition configuration (desktop removed, key-only SSH, default-deny firewall, audit, AIDE)
        run: |
          sudo apt-get install -y -qq --no-install-recommends nftables openssh-server openssh-client aide clamav >/dev/null
          sudo mkdir -p /run/sshd
          aide --config=build/live-build/editions/server/includes.chroot_after_packages/etc/aide/dai-server.conf --config-check
          python3 -m unittest tests/server/test_server_edition.py -v

      - name: Copyright notices, license, trademark policy and terms
        run: python3 -m unittest tests/legal/test_legal.py -v

      - name: No secrets in the repository (keys, tokens, private keys, passwords in configuration)
        run: python3 -m unittest tests/secrets/test_no_secrets.py -v

      - name: Texts (every en/he pair, the site's eight languages, the menu entries; docs/POLISH.md)
        run: python3 -m unittest tests/text/test_text_qa.py -v

      - name: Website (Hebrew RTL, AA contrast, no trackers, links)
        run: python3 -m unittest tests/site/test_site.py -v

      - name: Boot menu languages and the way to the desktop (GRUB, syslinux, Plymouth, SDDM)
        run: |
          sudo apt-get install -y -qq --no-install-recommends grub-common >/dev/null || true
          python3 -m unittest tests/boot/test_boot_languages.py tests/boot/test_boot_look.py tests/boot/test_measure.py -v

      - name: Unit tests (dai-ai)
        env:
          PYTHONPATH: apps/dai-i18n
        run: python3 -m unittest discover -s apps/dai-ai/tests -t apps/dai-ai -v

      - name: Languages (dai-i18n; the text catalog is up to date and every translation is usable)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-heal:apps/dai-forge:apps/dai-tune:apps/dai-ai:apps/dai-doctor:apps/dai-command
        run: |
          python3 -m unittest discover -s apps/dai-i18n/tests -t apps/dai-i18n -v
          python3 -m dai_i18n.tool extract --check
          python3 -m dai_i18n.tool check

      - name: Unit tests (dai-status, the Living Diamond's state, with D.Ai Heal and Evolve)
        env:
          PYTHONPATH: apps/dai-status:apps/dai-i18n:apps/dai-heal:apps/dai-evolve:apps/dai-forge:apps/dai-tune:apps/dai-ai:apps/dai-doctor:apps/dai-command
        run: python3 -m unittest discover -s apps/dai-status/tests -t apps/dai-status -v

      - name: Unit tests (dai-quick, quick settings, with the window)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-status:apps/dai-tune:apps/dai-ai:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-quick/tests -t apps/dai-quick -v

      - name: Unit tests (dai-tune)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-ai:apps/dai-forge:apps/dai-way
        run: python3 -m unittest discover -s apps/dai-tune/tests -t apps/dai-tune -v

      - name: Unit tests (dai-forge, with a real bubblewrap sandbox when available)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-tune:apps/dai-ai:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y -qq bubblewrap python3-pyqt6 >/dev/null || true
          python3 -m unittest discover -s apps/dai-forge/tests -t apps/dai-forge -v

      - name: Unit tests (dai-mom, the task manager, with a fake /proc and the window)
        env:
          PYTHONPATH: apps/dai-mom:apps/dai-i18n:apps/dai-status:apps/dai-clip:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-mom/tests -t apps/dai-mom -v

      - name: Unit tests (dai-ruby, the browser's policies, menu entry, start page and Diamond's native host)
        env:
          PYTHONPATH: apps/dai-ai
        run: python3 -m unittest discover -s apps/dai-ruby/tests -t apps/dai-ruby -v

      - name: Unit tests (dai-j, the mail client, against a local IMAP server, with the windows)
        env:
          PYTHONPATH: apps/dai-j:apps/dai-i18n:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-j/tests -t apps/dai-j -v

      - name: Unit tests (dai-raz, D.Ai's own checks against a fake system, and the accessibility audit)
        env:
          PYTHONPATH: apps/dai-raz:apps/dai-i18n:apps/dai-tune:apps/dai-ai
          QT_QPA_PLATFORM: offscreen
          DAI_REQUIRE_QT: "1"
        run: python3 -m unittest discover -s apps/dai-raz/tests -t apps/dai-raz -v

      - name: Unit tests (Ruby's extension - cleaning, remembering, spaces, snapshots - against a fake browser)
        run: node --test apps/dai-ruby/extension-tests/ruby.test.js

      - name: Unit tests (dai-voice)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-ai:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-voice/tests -t apps/dai-voice -v

      - name: Unit tests (dai-code)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-ai
        run: python3 -m unittest discover -s apps/dai-code/tests -t apps/dai-code -v

      - name: Unit tests (dai-welcome)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-ai:apps/dai-tune:apps/dai-forge:apps/dai-voice:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-welcome/tests -t apps/dai-welcome -v

      - name: Unit tests (dai-find, with the D.Ai Command integration)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-command:apps/dai-tune
        run: python3 -m unittest discover -s apps/dai-find/tests -t apps/dai-find -v

      - name: Unit tests (dai-doctor, with D.Ai Tune and the D.Ai Command integration)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-command:apps/dai-tune
        run: python3 -m unittest discover -s apps/dai-doctor/tests -t apps/dai-doctor -v

      - name: Unit tests (dai-privacy, with the panel indicator and D.Ai Command)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-command:apps/dai-tune
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-privacy/tests -t apps/dai-privacy -v

      - name: Unit tests (dai-backup, with a real restic backup, change, restore and check)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-command:apps/dai-tune
        run: |
          sudo apt-get install -y -qq restic >/dev/null || true
          python3 -m unittest discover -s apps/dai-backup/tests -t apps/dai-backup -v

      - name: Unit tests (dai-move, with the D.Ai Command integration)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-command:apps/dai-tune
        run: python3 -m unittest discover -s apps/dai-move/tests -t apps/dai-move -v

      - name: Unit tests (dai-clip, with the history window and D.Ai Command)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-command:apps/dai-tune:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-clip/tests -t apps/dai-clip -v

      - name: Unit tests (Diamond Chat - core, transport, pairing, pictures, window, a real Tor and real mDNS)
        env:
          PYTHONPATH: apps/dai-chat:apps/dai-i18n:apps/dai-raz:apps/dai-tune
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y -qq --no-install-recommends python3-nacl python3-zeroconf tor bubblewrap >/dev/null
          sudo systemctl stop tor.service tor@default.service 2>/dev/null || true  # the tests start their own Tor
          python3 -m unittest discover -s apps/dai-chat/tests -t apps/dai-chat -v

      - name: Unit tests (dai-sound, the diamond family)
        env:
          PYTHONPATH: apps/dai-sound
        run: python3 -m unittest discover -s apps/dai-sound/tests -t apps/dai-sound -v

      - name: Unit tests (dai-tv, D.Ai inside the television)
        env:
          PYTHONPATH: apps/dai-tv:apps/dai-i18n
        run: python3 -m unittest discover -s apps/dai-tv/tests -t apps/dai-tv -v
      - name: Unit tests (dai-rotate, the screen follows the tablet)
        env:
          PYTHONPATH: apps/dai-rotate:apps/dai-i18n
        run: python3 -m unittest discover -s apps/dai-rotate/tests -t apps/dai-rotate -v

      - name: Unit tests (dai-vm, Windows in a window, and the Tune sentence for KVM access)
        env:
          PYTHONPATH: apps/dai-vm:apps/dai-i18n:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-vm/tests -t apps/dai-vm -v

      - name: Unit tests (dai-pdf, the sandboxed PDF reader)
        env:
          PYTHONPATH: apps/dai-pdf:apps/dai-i18n:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y -qq --no-install-recommends python3-pyqt6.qtpdf python3-pikepdf bubblewrap tesseract-ocr tesseract-ocr-eng >/dev/null
          python3 -m unittest discover -s apps/dai-pdf/tests -t apps/dai-pdf -v

      - name: Unit tests (dai-ocr, copy text from the screen, and its D.Ai Command row)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-command:apps/dai-tune
        run: python3 -m unittest discover -s apps/dai-ocr/tests -t apps/dai-ocr -v

      - name: Unit tests (dai-focus, a quiet session with a timer)
        env:
          PYTHONPATH: apps/dai-i18n
        run: python3 -m unittest discover -s apps/dai-focus/tests -t apps/dai-focus -v

      - name: Unit tests (dai-settings, one window for Tune's settings, with the window)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-tune:apps/dai-ai:apps/dai-raz:apps/dai-forge
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-settings/tests -t apps/dai-settings -v

      - name: Unit tests (dai-way, a whole computer in one readable file)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-tune:apps/dai-ai:apps/dai-forge:apps/dai-heal:apps/dai-settings:apps/dai-raz
        run: python3 -m unittest discover -s apps/dai-way/tests -t apps/dai-way -v

      - name: Unit tests (dai-captions, live captions for what the computer plays, with the bar)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-voice:apps/dai-ai:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-captions/tests -t apps/dai-captions -v

      - name: Unit tests (dai-explain, the screen read and explained, with the window)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-ocr:apps/dai-tune:apps/dai-ai:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-explain/tests -t apps/dai-explain -v

      - name: Unit tests (dai-speak, Diamond reads aloud)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-raz:apps/dai-speak
        run: python3 -m unittest discover -s apps/dai-speak/tests -t apps/dai-speak -v
      - name: Unit tests (dai-store, find and set up software, with the window)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-tune:apps/dai-ai:apps/dai-raz:apps/dai-forge:apps/dai-heal
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-store/tests -t apps/dai-store -v

      - name: Unit tests (dai-heal, with the repair chat, D.Ai Forge and D.Ai Doctor)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-forge:apps/dai-tune:apps/dai-ai:apps/dai-doctor:apps/dai-command:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-heal/tests -t apps/dai-heal -v

      - name: Unit tests (dai-evolve, with D.Ai Command, Forge, Doctor and Heal)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-command:apps/dai-forge:apps/dai-tune:apps/dai-ai:apps/dai-doctor:apps/dai-heal
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s apps/dai-evolve/tests -t apps/dai-evolve -v

      - name: Unit tests (dai-oem, with the first-boot wizard and a real cryptsetup on an image file)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-forge:apps/dai-tune:apps/dai-ai:apps/dai-raz
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y -qq cryptsetup-bin python3-pyqt6 >/dev/null || true
          # As root, only for the cryptsetup test (an image file in a temporary folder; nothing else is touched).
          sudo env PYTHONPATH="$PYTHONPATH" QT_QPA_PLATFORM=offscreen python3 -m unittest discover -s apps/dai-oem/tests -t apps/dai-oem -v

      - name: Unit tests (dai-command)
        env:
          PYTHONPATH: apps/dai-i18n:apps/dai-tune:apps/dai-raz:apps/dai-ai
        run: python3 -m unittest discover -s apps/dai-command/tests -t apps/dai-command -v

  llama:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache llama.cpp build
        id: cache
        uses: actions/cache@v4
        with:
          path: llama-dist
          key: llama-${{ hashFiles('build/scripts/build-llama.sh') }}
      - name: Build llama.cpp (Debian trixie container)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie \
            bash build/scripts/build-llama.sh /src/llama-dist
          sudo chown -R "$(id -u):$(id -g)" llama-dist
      - name: Pack (keeps symlinks and permissions)
        run: tar -czf llama-dist.tar.gz -C llama-dist .
      - uses: actions/upload-artifact@v4
        with:
          name: llama-dist
          path: llama-dist.tar.gz
          retention-days: 3

  whisper:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache whisper.cpp build
        id: cache
        uses: actions/cache@v4
        with:
          path: whisper-dist
          key: whisper-${{ hashFiles('build/scripts/build-whisper.sh') }}
      - name: Build whisper.cpp (Debian trixie container)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie \
            bash build/scripts/build-whisper.sh /src/whisper-dist
          sudo chown -R "$(id -u):$(id -g)" whisper-dist
      - name: Pack (keeps symlinks and permissions)
        run: tar -czf whisper-dist.tar.gz -C whisper-dist .
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-dist
          path: whisper-dist.tar.gz
          retention-days: 3

  panel-plugin:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build lxqt-panel plugin (Debian trixie container)
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie \
            bash build/scripts/build-panel-plugin.sh /src/panel-plugin
          sudo chown -R "$(id -u):$(id -g)" panel-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: panel-plugin
          path: panel-plugin/
          retention-days: 3

  ruby-extension:
    # Firefox installs only signed add-ons. With the project's addons.mozilla.org API key (secrets
    # AMO_JWT_ISSUER / AMO_JWT_SECRET) the extension is signed as unlisted (self-distributed) and goes into
    # the image; without it, Ruby keeps stage 1 (docs/BROWSER.md §10).
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint and build the extension
        run: |
          npx --yes web-ext@8.3.0 lint --source-dir apps/dai-ruby/extension --self-hosted
          npx --yes web-ext@8.3.0 build --source-dir apps/dai-ruby/extension --artifacts-dir ruby-unsigned
      - name: Sign (only with the project's AMO key)
        if: env.AMO_JWT_ISSUER != ''
        run: |
          npx --yes web-ext@8.3.0 sign --source-dir apps/dai-ruby/extension --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --artifacts-dir ruby-signed
          mkdir -p ruby-extension && cp ruby-signed/*.xpi ruby-extension/ruby.xpi
      - uses: actions/upload-artifact@v4
        if: env.AMO_JWT_ISSUER != ''
        with:
          name: ruby-extension
          path: ruby-extension/
          retention-days: 3

  # D.Ai Phone (docs/MOBILE.md C1): arm64 under QEMU user emulation, booted in QEMU's virt machine. Experimental:
  # it runs on its own and never fails the workflow until it is green on its own merits.
  build-phone:
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Register arm64 user emulation on the runner (binfmt_misc, fix-binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          ls /proc/sys/fs/binfmt_misc/ | grep -E '^qemu-aarch64$'
      # Under emulation the package installation takes about an hour and the squashfs another one (the
      # bootstrap is mmdebstrap's, minutes instead of debootstrap's hour: build-iso.sh bootstrap_foreign);
      # 133 minutes in the first green run, with the runner's speed varying between runs.
      - name: Build the phone ISO (arm64, Debian trixie container)
        timeout-minutes: 180
        run: |
          version="0.1.0-alpha+${GITHUB_SHA::7}"
          docker run --rm --privileged \
            -e DAI_VERSION="$version" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src" -w /src \
            debian:trixie \
            bash build/scripts/build-iso.sh phone /src/out
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-phone
          path: .work/phone/build.log
          if-no-files-found: ignore
      - name: Install QEMU for arm64
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-arm xorriso
      - name: Boot test (QEMU virt, emulated, slow)
        env:
          BOOT_TIMEOUT: "1500"
          DESKTOP_WAIT: "180"
          QEMU_MEM: "3072"
        run: bash tests/boot/boot-test.sh out/dai-os-phone-*.iso boot-artifacts
      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-phone
          path: boot-artifacts/
          if-no-files-found: ignore
  # D.Ai TV on ARM boxes (docs/TV.md §14): the tv edition for arm64, built and booted like the phone. Experimental
  # for the same reason: hours under emulation, on its own, never failing the workflow.
  build-tv-arm64:
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Register arm64 user emulation on the runner (binfmt_misc, fix-binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          ls /proc/sys/fs/binfmt_misc/ | grep -E '^qemu-aarch64$'
      # Under emulation the package installation takes about an hour and the squashfs another one (the
      # bootstrap is mmdebstrap's, minutes instead of debootstrap's hour: build-iso.sh bootstrap_foreign);
      # 133 minutes in the first green run, with the runner's speed varying between runs.
      - name: Build the TV ISO for arm64 (Debian trixie container)
        timeout-minutes: 180
        run: |
          version="0.1.0-alpha+${GITHUB_SHA::7}"
          docker run --rm --privileged \
            -e DAI_VERSION="$version" \
            -e DAI_ARCH=arm64 \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src" -w /src \
            debian:trixie \
            bash build/scripts/build-iso.sh tv /src/out
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-tv-arm64
          path: .work/tv/build.log
          if-no-files-found: ignore
      - name: Install QEMU for arm64
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-arm xorriso
      - name: Boot test (QEMU virt, emulated, slow)
        env:
          BOOT_TIMEOUT: "1500"
          DESKTOP_WAIT: "600"   # Kodi starts with software rendering under TCG
          QEMU_MEM: "3072"
        run: bash tests/boot/boot-test.sh out/dai-os-tv-*-arm64.iso boot-artifacts
      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-tv-arm64
          path: boot-artifacts/
          if-no-files-found: ignore
  build:
    needs: [lint, llama, whisper, panel-plugin, ruby-extension]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        edition: [user, dev, edu, tv]
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: llama-dist

      - uses: actions/download-artifact@v4
        with:
          name: whisper-dist

      - uses: actions/download-artifact@v4
        with:
          name: panel-plugin
          path: panel-plugin

      - uses: actions/download-artifact@v4
        continue-on-error: true   # only there when the extension was signed
        with:
          name: ruby-extension
          path: ruby-extension

      - name: Build ISO (Debian trixie container)
        timeout-minutes: 40
        run: |
          mkdir -p llama-dist && tar -xzf llama-dist.tar.gz -C llama-dist
          mkdir -p whisper-dist && tar -xzf whisper-dist.tar.gz -C whisper-dist
          version="0.1.0-alpha+${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          docker run --rm --privileged \
            -e DAI_VERSION="$version" \
            -e DAI_LLAMA_DIST=/src/llama-dist \
            -e DAI_WHISPER_DIST=/src/whisper-dist \
            -e DAI_PANEL_PLUGIN=/src/panel-plugin \
            -e DAI_RUBY_XPI=/src/ruby-extension/ruby.xpi \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src" -w /src \
            debian:trixie \
            bash build/scripts/build-iso.sh "${{ matrix.edition }}" /src/out

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.edition }}
          path: .work/${{ matrix.edition }}/build.log
          if-no-files-found: ignore

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
          # Allow the runner user to use KVM when the host exposes it.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot test
        run: bash tests/boot/boot-test.sh out/dai-os-${{ matrix.edition }}-*.iso boot-artifacts

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.edition }}
          path: boot-artifacts/
          if-no-files-found: ignore

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: dai-os-${{ matrix.edition }}-iso
          path: |
            out/*.iso
            out/*.sha256
            out/*.packages
          retention-days: 7
          compression-level: 0

      - name: Upload D.Ai packages
        if: matrix.edition == 'user'
        uses: actions/upload-artifact@v4
        with:
          name: dai-debs
          path: out/debs/*.deb
          retention-days: 7

  # A v* tag publishes a GitHub Release: both ISOs, SHA256SUMS and the signed
  # apt repository for updates (docs/RELEASE.md). Only after every boot test passed.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # Add required reviewers to this environment (Settings → Environments) to approve each release.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dai-os-*-iso
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: dai-debs
          path: debs

      - name: Import the archive signing key
        env:
          DAI_APT_SIGNING_KEY: ${{ secrets.DAI_APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          public=build/keys/dai-archive-keyring.asc
          if [[ -z "$DAI_APT_SIGNING_KEY" ]]; then
            # Images that trust the key would see an unsigned update source.
            [[ ! -f "$public" ]] || { echo "::error::$public exists but DAI_APT_SIGNING_KEY is not set"; exit 1; }
            echo "::warning::No signing key: publishing ISOs without the update repository"
            exit 0
          fi
          [[ -f "$public" ]] || { echo "::error::DAI_APT_SIGNING_KEY is set but $public is missing"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s\n' "$DAI_APT_SIGNING_KEY" | gpg --batch --import 2>/dev/null
          secret_fpr="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          public_fpr="$(gpg --batch --with-colons --import-options show-only --import "$public" | awk -F: '/^fpr/ {print $10; exit}')"
          [[ -n "$secret_fpr" && "$secret_fpr" == "$public_fpr" ]] \
            || { echo "::error::the signing key does not match $public"; exit 1; }
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          echo "DAI_APT_KEY_ID=$secret_fpr" >>"$GITHUB_ENV"

      - name: Checksums and update repository
        run: |
          set -euo pipefail
          cd dist
          rm -f ./*.sha256
          sha256sum ./*.iso | sed 's| \./| |' >SHA256SUMS
          cat SHA256SUMS
          if [[ -n "${DAI_APT_KEY_ID:-}" ]]; then
            gpg --batch --local-user "$DAI_APT_KEY_ID" --armor --detach-sign -o SHA256SUMS.asc SHA256SUMS
            sudo apt-get install -y --no-install-recommends apt-utils >/dev/null
            bash ../build/scripts/build-apt-repo.sh ../debs ../repo
            cp ../repo/* .
          fi
          ls -la

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          flags=()
          [[ "$tag" == *-* ]] && flags+=(--prerelease)
          {
            echo "D.Ai OS ${tag} — by Diamond Rubinny (d.Ai)."
            echo
            echo "- \`dai-os-user-*.iso\`: for everyday use. \`dai-os-dev-*.iso\`: with developer tools."
            echo "- Verify: \`sha256sum -c SHA256SUMS --ignore-missing\`$( [[ -f dist/SHA256SUMS.asc ]] && echo ' and gpg --verify SHA256SUMS.asc SHA256SUMS')."
            echo "- Installing: docs/INSTALL.md. Updates: docs/RELEASE.md."
            echo
            echo "Every image passed the automated boot and system tests before publishing. Alpha software: back up first."
          } >notes.md
          gh release create "$tag" dist/* --verify-tag --title "D.Ai OS $tag" --notes-file notes.md "${flags[@]}"

  # Publish boot screenshots and check reports to the ci-screenshots branch
  # so they can be viewed on GitHub and referenced from docs.
  # Stage 1 of docs/HARDWARE.md: measure, do not judge. Boots the user edition twice on this runner (without KVM,
  # so the numbers are relative to other runs of this job, not to real computers) and records login time, desktop
  # time and memory in use after a minute idle. Not required: a failed measurement does not block the release.
  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        profile:
          - { name: weak, memory: 2048, cpus: 1 }
          - { name: standard, memory: 4096, cpus: 2 }
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso

      - name: Download the user edition ISO
        uses: actions/download-artifact@v4
        with:
          name: dai-os-user-iso
          path: iso

      - name: Measure boot on ${{ matrix.profile.name }} (${{ matrix.profile.memory }} MB, ${{ matrix.profile.cpus }} CPU)
        env:
          QEMU_MEM: ${{ matrix.profile.memory }}
          QEMU_SMP: ${{ matrix.profile.cpus }}
          MEASURE_JSON: measure-${{ matrix.profile.name }}.json
          MEASURE_ONLY: "1"
          MEASURE_IDLE: "60"
          MEASURE_DESKTOP_TIMEOUT: "2400"
          BOOT_TIMEOUT: "2400"
        run: bash tests/boot/boot-test.sh "$(ls iso/*.iso | head -n1)" measure-artifacts

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-${{ matrix.profile.name }}
          path: |
            measure-${{ matrix.profile.name }}.json
            measure-artifacts/
          if-no-files-found: ignore
          retention-days: 90

  screenshots:
    needs: build
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: boot-*
          path: shots

      - name: Publish to ci-screenshots branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p publish
          for edition in user dev edu tv; do
            for file in desktop.png apps.png panel-field.png ai-answer.png start-menu.png forge-preview.png forge-window.png forge-app.png installer.png welcome.png clip.png quick.png mom.png welcome-ar.png mom-ru.png j.png find.png doctor.png heal.png pdf.png vm.png settings.png store.png captions.png explain.png keyboard.png magnifier.png boot-menu.png boot-languages.png login.png boot-splash-1.png boot-splash-2.png boot-splash-3.png system-checks.txt; do
              src="shots/boot-$edition/$file"
              if [ -f "$src" ]; then cp "$src" "publish/$edition-$file"; fi
            done
          done
          if [ -z "$(ls -A publish)" ]; then
            echo "No screenshots to publish"
            exit 0
          fi
          cd publish
          printf '# D.Ai OS CI screenshots\n\n- Source commit: %s\n- Workflow run: %s\n' \
            "$SOURCE_SHA" "$RUN_URL" > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI screenshots for ${SOURCE_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screenshots
          ls -la
