name: AI models

# Downloads every model in the catalog and checks its SHA-256 against the
# pinned value and the hash Hugging Face publishes. Runs only when the
# catalog changes (the downloads are large).
on:
  push:
    branches: [main]
    paths: ["apps/dai-ai/data/models.json", "build/scripts/verify-models.py", ".github/workflows/ai-models.yml"]
  pull_request:
    paths: ["apps/dai-ai/data/models.json", "build/scripts/verify-models.py", ".github/workflows/ai-models.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify model hashes
        run: python3 build/scripts/verify-models.py apps/dai-ai/data/models.json
