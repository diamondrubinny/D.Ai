<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>D.Ai diamond</title>
  <desc>D.Ai OS brand mark: a brilliant-cut diamond, violet to cyan.</desc>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="33" r="31" fill="url(#glow)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.6" stroke-linejoin="round">
    <!-- crown -->
    <polygon points="4,24 20,9 18,24" fill="#9B82FF"/>
    <polygon points="20,9 32,24 18,24" fill="#8A6CFF"/>
    <polygon points="20,9 44,9 32,24" fill="#C9BBFF"/>
    <polygon points="44,9 46,24 32,24" fill="#5ECBF2"/>
    <polygon points="44,9 60,24 46,24" fill="#22D3EE"/>
    <!-- pavilion -->
    <polygon points="4,24 18,24 32,59" fill="#5B3FD6"/>
    <polygon points="18,24 32,24 32,59" fill="#7255F2"/>
    <polygon points="32,24 46,24 32,59" fill="#2AA9DE"/>
    <polygon points="46,24 60,24 32,59" fill="#1689B5"/>
  </g>
  <polygon points="4,24 20,9 44,9 60,24 32,59" fill="url(#sheen)"/>
  <!-- sparkle -->
  <path d="M54 3 L55.3 7.7 L60 9 L55.3 10.3 L54 15 L52.7 10.3 L48 9 L52.7 7.7 Z" fill="#FFFFFF" opacity="0.95"/>
</svg>
