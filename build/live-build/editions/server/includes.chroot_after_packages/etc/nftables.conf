# D.Ai Server firewall (docs/SERVER.md §4, rule 5): nothing comes in unless it is listed here.
# SSH is reachable only from the administrators' computers in /etc/dai/admin-hosts.nft. That file is empty
# until the install fills it, so until then nobody can reach SSH: the default is closed, on purpose.

flush ruleset

table inet dai_filter {
	set admin_ssh {
		type ipv4_addr
		flags interval
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state established,related accept
		iif "lo" accept

		# SSH: from the administrators' computers only, and at most 6 new connections a minute against guessing
		ip saddr @admin_ssh tcp dport 22 ct state new limit rate 6/minute accept

		# Ports opened later with D.Ai Tune ("open port N"); managed file, see docs/TUNE.md
		include "/etc/dai/firewall-allow.nft"

		# IPv6 needs ICMPv6 for neighbour discovery and path MTU
		meta l4proto ipv6-icmp accept

		# DHCPv6 client replies
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		# Everything else is dropped; a few drops a minute are logged, so an intrusion attempt leaves a trace
		limit rate 5/minute log prefix "dai-drop: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

include "/etc/dai/admin-hosts.nft"
