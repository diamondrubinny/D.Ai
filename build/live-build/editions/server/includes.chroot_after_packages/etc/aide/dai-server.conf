# D.Ai Server file-integrity rules (docs/SERVER.md §4, rule 8). Used by dai-aide-init and dai-aide-check.
# The check is a local report in the journal; nothing is sent anywhere.
database_in=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
gzip_dbout=yes
report_url=stdout

# What is compared for each file
Full = p+i+n+u+g+s+m+c+sha512

# Where
/boot Full
/etc Full
/usr/bin Full
/usr/sbin Full
/usr/lib Full
/usr/local Full

# Files that change by design, so they would report every day
!/etc/mtab
!/etc/adjtime
!/etc/resolv.conf
!/var/log
