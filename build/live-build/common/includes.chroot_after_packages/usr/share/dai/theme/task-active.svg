  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="47" height="43" rx="12" fill="#7C5CFF" fill-opacity="0.24" stroke="#7C5CFF" stroke-opacity="0.5"/>
