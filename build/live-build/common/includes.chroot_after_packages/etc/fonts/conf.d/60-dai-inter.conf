<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: Apache-2.0 · (c) 2026 Diamond Rubinny (d.Ai)
     The interface font is Inter (docs/LOOK.md); Hebrew and Arabic glyphs come from Noto Sans. -->
<fontconfig>
  <alias binding="strong">
    <family>Inter</family>
    <prefer><family>Inter</family><family>Noto Sans Hebrew</family><family>Noto Sans Arabic</family><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Noto Sans Hebrew</family><family>Noto Sans</family></prefer>
  </alias>
</fontconfig>
