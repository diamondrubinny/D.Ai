# The boot menu of an installed D.Ai OS (docs/V2.md D2): its name and the diamond's background.
# Read by update-grub (Calamares runs it while installing).
GRUB_DISTRIBUTOR="D.Ai OS"
GRUB_BACKGROUND="/usr/share/dai/branding/boot/grub-splash.png"
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="white/black"
GRUB_GFXMODE="1920x1080,1280x800,auto"
