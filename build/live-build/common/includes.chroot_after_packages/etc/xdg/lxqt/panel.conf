panels=panel1

[panel1]
plugins=fancymenu,daicommand,taskbar,statusnotifier,lang,volume,worldclock,showdesktop
position=Bottom
panelSize=48
iconSize=24
lineCount=1
desktop=0
hidable=false

[fancymenu]
type=fancymenu
alignment=Left
; The Start button is the D.Ai diamond (icon only; tooltip and screen readers say "Start").
ownIcon=true
icon=/usr/share/dai/branding/dai-logo.svg
showText=false
filterClear=true
autoSel=true
autoSelDelay=150
buttonsAtTop=false

; Text field next to Start (apps/dai-panel-plugin); "command" below is the
; fallback button used when the plugin is not built.
[daicommand]
type=daicommand
alignment=Left

[command]
type=customcommand
alignment=Left
command=dai-command --label
runWithBash=false
repeat=false
click=dai-command
icon=/usr/share/dai/branding/dai-command.svg
tooltip=D.Ai Command (Super+Space)
maxWidth=320

[taskbar]
type=taskbar
buttonWidth=200
closeOnMiddleClick=true
groupingEnabled=false
raiseOnCurrentDesktop=true

[statusnotifier]
type=statusnotifier
alignment=Right

; Keyboard layout indicator (HE/EN); click or Alt+Shift switches (dai-lang)
[lang]
type=customcommand
alignment=Right
command=dai-lang --label
runWithBash=false
repeat=true
repeatTimer=1
click=dai-lang toggle
tooltip=Keyboard layout (Alt+Shift)

[volume]
type=volume
device=0
alignment=Right

[worldclock]
type=worldclock
alignment=Right

[showdesktop]
type=showdesktop
alignment=Right
