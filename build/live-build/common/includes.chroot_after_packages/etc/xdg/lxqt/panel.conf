panels=panel1

[panel1]
plugins=fancymenu,command,taskbar,statusnotifier,kbindicator,volume,worldclock,showdesktop
position=Bottom
panelSize=46
iconSize=22
lineCount=1
desktop=0
hidable=false

[fancymenu]
type=fancymenu
alignment=Left
showText=true
text=Start
filterClear=true
autoSel=true
autoSelDelay=150
buttonsAtTop=false

[command]
type=customcommand
alignment=Left
command=dai-command --label
runWithBash=false
repeat=false
click=dai-command
icon=/usr/share/dai/branding/dai-command.svg
tooltip=D.Ai Command (Super+Space)
maxWidth=320

[taskbar]
type=taskbar
buttonWidth=200
closeOnMiddleClick=true
groupingEnabled=false
raiseOnCurrentDesktop=true

[statusnotifier]
type=statusnotifier
alignment=Right

[kbindicator]
type=kbindicator
alignment=Right

[volume]
type=volume
device=0
alignment=Right

[worldclock]
type=worldclock
alignment=Right

[showdesktop]
type=showdesktop
alignment=Right
