#!/usr/sbin/nft -f
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2026 Diamond Rubinny (d.Ai)
# D.Ai OS default firewall: drop unsolicited inbound traffic, allow all outbound.

flush ruleset

table inet dai_filter {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state established,related accept
		iif "lo" accept

		# Ports opened with D.Ai Tune ("open port N"); managed file, see docs/TUNE.md
		include "/etc/dai/firewall-allow.nft"

		# IPv6 needs ICMPv6 for neighbour discovery and path MTU
		meta l4proto ipv6-icmp accept

		# DHCPv6 client replies
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
